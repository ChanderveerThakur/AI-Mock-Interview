<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP — Mock Interview AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0c1222;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 40% 40%, rgba(20, 184, 166, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 60% 60%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 30%, rgba(8, 145, 178, 0.08) 0%, transparent 50%);
            animation: bgShift 18s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(1%, -1%) rotate(0.5deg); }
            66% { transform: translate(-1%, 1%) rotate(-0.5deg); }
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            animation: cardSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardSlide {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-card .logo span {
            font-size: 36px;
        }

        .auth-card h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: #f0fdfa;
            margin-bottom: 6px;
        }

        .auth-card .subtitle {
            text-align: center;
            font-size: 14px;
            color: rgba(204, 251, 241, 0.4);
            margin-bottom: 36px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(153, 246, 228, 0.5);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #f0fdfa;
            font-size: 22px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            text-align: center;
            letter-spacing: 12px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .form-group input:focus {
            border-color: rgba(20, 184, 166, 0.5);
            background: rgba(20, 184, 166, 0.05);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0d9488, #0891b2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0f766e, #0e7490);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(20, 184, 166, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .resend-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }

        .resend-link a {
            color: #5eead4;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .resend-link a:hover {
            color: #99f6e4;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <div class="logo"><span>🔐</span></div>
            <h1>Verify Email</h1>
            <p class="subtitle">We've sent a 6-digit OTP to your email.<br>Enter it below to verify your account.</p>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>One-Time Password</label>
                    <input type="text" name="otp" placeholder="• • • • • •" required maxlength="6" autocomplete="one-time-code">
                </div>

                <button type="submit" class="btn-primary">Verify & Continue</button>
            </form>

            <div class="resend-link">
                Didn't receive the code?
                <a href="{% url 'register' %}">Go back & resend</a>
            </div>

        </div>
    </div>

</body>
</html>
