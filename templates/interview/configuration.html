<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Interview Setup — Mock Interview AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0c1222;
            padding: 30px 20px;
            color: #d1fae5;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 25% 50%, rgba(20, 184, 166, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 75% 25%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(8, 145, 178, 0.08) 0%, transparent 50%);
            animation: bgShift 18s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -2%) rotate(1deg); }
            66% { transform: translate(-1%, 1%) rotate(-1deg); }
        }

        .config-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
        }

        .config-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 44px 38px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            animation: cardSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardSlide {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-area .icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: inline-block;
        }

        .header-area h1 {
            font-size: 26px;
            font-weight: 700;
            color: #f0fdfa;
            margin-bottom: 6px;
        }

        .header-area p {
            font-size: 14px;
            color: rgba(204, 251, 241, 0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(153, 246, 228, 0.7);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 15px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #f0fdfa;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group select option {
            background: #0f172a;
            color: #f0fdfa;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(20, 184, 166, 0.5);
            background: rgba(20, 184, 166, 0.05);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0d9488, #0891b2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0f766e, #0e7490);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(20, 184, 166, 0.3);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .nav-back {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }

        .nav-back a {
            color: #5eead4;
            text-decoration: none;
            font-weight: 500;
        }

        .nav-back a:hover {
            color: #99f6e4;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 14px;
            }

            .config-card {
                padding: 28px 18px;
                border-radius: 20px;
            }

            .header-area {
                margin-bottom: 22px;
            }

            .header-area .icon {
                font-size: 32px;
            }

            .header-area h1 {
                font-size: 21px;
            }

            .header-area p {
                font-size: 13px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .btn-submit {
                padding: 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="config-container">
        <div class="config-card">

            <div class="header-area">
                <div class="icon">🎯</div>
                <h1>Mock Technical Interview</h1>
                <p>Configure your customized AI interview session</p>
            </div>

            {% if error %}
                <div class="error-message">
                    ⚠️ {{ error }}
                    <div style="margin-top: 8px;">
                        <a href="javascript:location.reload()" style="color: #fee2e2; font-weight: 600; text-decoration: underline;">Click here to Refresh</a>
                    </div>
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group full-width">
                    <label>Target Skills / Technologies</label>
                    <textarea name="skills" placeholder="e.g. Python, Django, REST APIs, SQL, System Design" required rows="2">Python, Django, Backend Development</textarea>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Difficulty Level</label>
                        <select name="difficulty">
                            <option value="easy">Easy (Entry Level)</option>
                            <option value="medium" selected>Medium (Mid Level)</option>
                            <option value="hard">Hard (Senior Level)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Experience (Years)</label>
                        <input type="number" name="experience" min="0" max="30" value="2" required>
                    </div>

                    <div class="form-group">
                        <label>Total Questions</label>
                        <input type="number" name="total_questions" min="1" max="15" value="5" required>
                    </div>

                    <div class="form-group">
                        <label>Question Type</label>
                        <select name="type">
                            <option value="mixed" selected>Mixed (MCQ + Text)</option>
                            <option value="mcq">MCQ Only</option>
                            <option value="text">Text Only</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Generate Interview Questions ⚡
                </button>
            </form>

            <div class="nav-back">
                <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
            </div>

        </div>
    </div>

    <script>
        const form = document.querySelector('form');
        const btn = document.getElementById('submitBtn');
        form.addEventListener('submit', function() {
            btn.innerHTML = 'Generating Questions with AI... ⏳';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
        });
    </script>

</body>
</html>
